  body { word-break: keep-all; overflow-wrap: break-word; font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; margin: 0; padding: 48px 20px 40px;

  .links { margin-top: 36px; font-size: .85rem; color: var(--muted); }
